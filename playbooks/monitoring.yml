---
- hosts: localhost
  tasks:
    - include_role:
        name: influxdata_repo_cleanup

- hosts: localhost
  become: true
  vars:
    http_server_status: "configuring"
    http_server_role: "monitoring"
  gather_facts: true
  roles:
    - oci-cloud-agent
    - http_server
    - privilege_group
    - packages
    - firewall
    - oci-hostname
    - ssh
    - limits
    - boot-volume
    - mgmt

- hosts: localhost
  become: true
  gather_facts: true
  tasks:
    - include_role:
        name: localdisk
      when: localdisk | default(true) | bool

# New role to clean old tmp dir files
- hosts: localhost
  become: true
  tasks:
    - include_role:
        name: clean_tmp

- hosts: localhost
  become: true
  tasks:
    - include_role:
        name: nfs-client
      vars:
        local_path: "/home"
        export_host: "{{ controller_hostname }}"
        export_path: "/home"
        options: "defaults,noatime,bg,timeo=100,ac,actimeo=120,nocto,rsize=1048576,wsize=1048576,nolock,local_lock={{ lock }},mountproto=tcp,sec=sys,_netdev"
        lock: "all"
      when: shared_home == "nfs"
    - include_role:
        name: nfs-client
      vars:
        local_path: "/home"
        export_host: "{{ nfs_source_IP }}"
        export_path: "{% if create_fss == 'new' %}/home{% else %}{{ nfs_source_path }}/home{% endif %}"
        options: ""
        lock: "none"
        nfs_client_marker: "{{ fss_home_marker_path }}"
      when: shared_home == "fss"
    - include_role:
        name: nfs-client
      vars:
        local_path: "{{ nfs_target_path }}"
        export_host: "{{ nfs_source_IP }}"
        export_path: "{{ nfs_source_path }} "
        options: "{{ nfs_options }}"
        lock: "none"
      when: add_nfs | default(false) | bool

- hosts: localhost
  vars:
    enroot_top_path: "{{ nvme_path }}/enroot/"
  pre_tasks:
    - name: Prepare shared 3rdparty paths
      ansible.builtin.import_tasks: tasks/prepare_thirdparty_paths.yml
  tasks:
    - include_role:
        name: docker
    - include_role:
        name: nvidia-enroot
    - include_role:
        name: healthchecks
        apply:
          become: true
    - name: Install DGXC benchmarking shell integration
      ansible.builtin.include_role:
        name: dgxc
      vars:
        dgxc_install_shared_components: false
        dgxc_install_node_integration: true
      when:
        - dgxc_benchmarking | default(false) | bool
        - pyxis | default(false) | bool
- hosts: localhost
  vars:
    slurm_mode: "login"
    enroot_top_path: "{{ nvme_path }}/enroot/"
    compute_node: false
  pre_tasks:
    - name: Collect cluster archiecture context
      ansible.builtin.import_tasks: tasks/collect_cluster_context.yml
    - name: Prepare shared 3rdparty paths
      ansible.builtin.import_tasks: tasks/prepare_thirdparty_paths.yml
  tasks:
    - include_role:
        name: rack-aware
    - include_role:
        name: slurm
      when: slurm | default(false) | bool

- hosts: controller, slurm_backup
  tasks:
    - name: Wait for the Slurm REST API JWT token
      become: true
      ansible.builtin.wait_for:
        path: "{{ slurm_nfs_path }}/spool_{{ cluster_name }}/slurm/jwt_hs256.token"
        state: present
        timeout: 1200
      when:
        - cluster_monitoring | default(false) | bool
        - slurm | default(false) | bool
        - slurm_job_monitoring | default(false) | bool
        - groups['monitoring'] | length > 0

    - ansible.builtin.include_role:
        name: slurm_monitoring
      vars:
        slurm_monitoring_controller_rest_exporter_enabled: "{{ slurm_job_monitoring | default(false) | bool }}"
        slurm_monitoring_controller_job_exporter_enabled: "{{ slurm_job_monitoring | default(false) | bool }}"
        slurm_monitoring_controller_enable_db_compact: >-
          {{
            slurm_job_monitoring | default(false) | bool
            and inventory_hostname == (groups['controller'] | first)
          }}
      when:
        - cluster_monitoring | default(false) | bool
        - slurm | default(false) | bool
        - slurm_job_monitoring | default(false) | bool
        - groups['monitoring'] | length > 0

- hosts: controller
  tasks:
    - ansible.builtin.include_role:
        name: get_nodes_in_cluster
      when: cluster_monitoring | default(false) | bool

    - ansible.builtin.include_role:
        name: prometheus_targets
      when: cluster_monitoring | default(false) | bool

- hosts: localhost
  gather_facts: true
  vars:
    ansible_user: "{{ cluster_admin_user }}"
  tasks:
    - ansible.builtin.include_role:
        name: wait_for_cloud_init

    - ansible.builtin.include_role:
        name: grafana
      when: cluster_monitoring | default(false) | bool

    - ansible.builtin.include_role:
        name: metrics-exporter
        tasks_from: nccl_inspector_collector.yml
      when:
        - cluster_monitoring | default(false) | bool
        - slurm_job_monitoring | default(false) | bool

- hosts: localhost
  gather_facts: true
  vars:
    ansible_user: "{{ cluster_admin_user }}"
  tasks:
    - ansible.builtin.include_role:
        name: oci-metrics-telegraf
      when:
        - cluster_monitoring | default(false) | bool
        - (metrics_stream_ocid | default('')) | length > 0

- hosts: localhost
  gather_facts: true
  vars:
    ansible_user: "{{ cluster_admin_user }}"
  tasks:
    - name: Force delegated monitoring host tasks to run locally during monitoring bootstrap
      ansible.builtin.add_host:
        name: "{{ groups['monitoring'][0] }}"
        ansible_connection: local
        ansible_user: "{{ cluster_admin_user }}"
      when: groups['monitoring'] | length > 0

    - ansible.builtin.include_role:
        name: prometheus
      when: cluster_monitoring | default(false) | bool

- hosts: localhost
  become: true
  vars:
    http_server_status: "configured"
    http_server_role: "monitoring"
  gather_facts: true
  roles:
    - http_server
