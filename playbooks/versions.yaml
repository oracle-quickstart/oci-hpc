---
# This file serves as a central place to define 3rd party downloads and repositories.
#
# The global structure follows the pattern
#
#   role -> [package ->] selector -> source,
#
# where role refers to the ansible role, and selectors define the operating
# system, e.g. ubuntu24, oraclelinux, or default.
#
# Source may be either a url or a repository definition as per the examples
# below.  The following architecture variables are expanded:
# - architecture
# - amd64_or_arm64
# - x86_64_or_aarch64
# with additional filters that will translate x86_64 or aarch64:
# - maybe_arm64
# - maybe_amd64
#
# The OCI fact finder will take this file and provide expansions of URLs and
# repositories for the current operating system and architecture, as well as a
# cache location for URL artifacts, i.e.:
#
#   ansible_facts['oci_versions'].role.url
#   ansible_facts['oci_versions'].role.cache
#
# with an optional architecture expansion (if such an expansion is present in
# the URL):
#
#   ansible_facts['oci_versions'].role['x86_64'].url
#   ansible_facts['oci_versions'].role['x86_64'].cache
#
# or
# 
#   ansible_facts['oci_versions'].role.package.repo
#   ansible_facts['oci_versions'].role.package.packages
#
# The nested `package` indirection is optional.
#
# Examples:
#
# monitoring:
#   agent:
#     default:
#       version: "2.0"
#       url:   # Can also be a single URL
#         - "https://example.org/agent-{{ version }}-{{ amd64_or_arm64 }}.tar.gz"
#         - "https://mirror.org/agent-{{ version }}-{{ architecture | maybe_arm64 }}.tar.gz"
# container:
#   ubuntu24:
#     repo: "https://example.org/apt"
#     packages: [container-toolkit]
nvidia_enroot:
  enroot:
    ubuntu:
      version: "3.5.0"
      url: "https://github.com/NVIDIA/enroot/releases/download/v{{ version }}/enroot_{{ version }}-1_{{ architecture | maybe_amd64 | maybe_arm64 }}.deb"
    oraclelinux:
      version: "3.5.0"
      url: "https://github.com/NVIDIA/enroot/releases/download/v{{ version }}/enroot-{{ version }}-1.el8.{{ architecture }}.rpm"
  enroot_caps:
    ubuntu:
      version: "3.5.0"
      url: "https://github.com/NVIDIA/enroot/releases/download/v{{ version }}/enroot+caps_{{ version }}-1_{{ architecture | maybe_amd64 | maybe_arm64 }}.deb"
    oraclelinux:
      version: "3.5.0"
      url: "https://github.com/NVIDIA/enroot/releases/download/v{{ version }}/enroot+caps-{{ version }}-1.el8.{{ architecture }}.rpm"
