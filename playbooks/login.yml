- hosts: localhost
  become: true
  vars:
    http_server_status: "configuring"
    http_server_role: "login"
  gather_facts: true
  roles:
    - oci-cloud-agent
    - http_server
    - privilege_group
    - packages
    - firewall
    - oci-hostname
    - ssh
    - limits
    - boot-volume
    - mpivars
    - queue_read
    - mgmt
    - oom-adjust

- hosts: localhost
  become: true
  gather_facts: true
  tasks:
    - ansible.builtin.include_role:
        name: localdisk
      when: localdisk | default(true) | bool

# New role to clean old tmp dir files
- hosts: localhost
  become: true
  tasks:
    - ansible.builtin.include_role:
        name: clean_tmp

- hosts: localhost
  become: true
  tasks:
    - ansible.builtin.include_role:
        name: nfs-client
      vars:
        local_path: "/home"
        export_host: "{{ controller_hostname }}"
        export_path: "/home"
        options: "defaults,noatime,bg,timeo=100,ac,actimeo=120,nocto,rsize=1048576,wsize=1048576,nolock,local_lock={{ lock }},mountproto=tcp,sec=sys,_netdev"
        lock: "all"
      when: shared_home == "nfs"
    - ansible.builtin.include_role:
        name: nfs-client
      vars:
        local_path: "/home"
        export_host: "{{ nfs_source_IP }}"
        export_path: "{% if create_fss == 'new' %}/home{% else %}{{ nfs_source_path }}/home{% endif %}"
        options: ""
        lock: "none"
        nfs_client_marker: "{{ fss_home_marker_path }}"
      when: shared_home == "fss"
    - ansible.builtin.include_role:
        name: nfs-client
      vars:
        local_path: "{{ nfs_target_path }}"
        export_host: "{{ nfs_source_IP }}"
        export_path: "{{ nfs_source_path }} "
        options: "{{ nfs_options }}"
        lock: "none"
      when: add_nfs | default(false) | bool

- hosts: localhost
  become: true
  tasks:
    - ansible.builtin.include_role:
        name: sssd
      when: ldap | default(true) | bool

- name: Configure login container runtime and health integrations
  hosts: localhost
  vars:
    enroot_top_path: "{{ nvme_path }}/enroot/"
  pre_tasks:
    - name: Prepare shared 3rdparty paths
      ansible.builtin.import_tasks: tasks/prepare_thirdparty_paths.yml
  tasks:
    - ansible.builtin.include_role:
        name: docker
    - ansible.builtin.include_role:
        name: nvidia-enroot
    - ansible.builtin.include_role:
        name: healthchecks
        apply:
          become: true
    - name: Install DGXC benchmarking shell integration
      ansible.builtin.include_role:
        name: dgxc
      vars:
        dgxc_install_shared_components: false
        dgxc_install_node_integration: true
      when:
        - dgxc_benchmarking | default(false) | bool
        - pyxis | default(false) | bool

- hosts: localhost
  pre_tasks:
    - name: Prepare shared 3rdparty paths
      ansible.builtin.import_tasks: tasks/prepare_thirdparty_paths.yml
  tasks:
    - ansible.builtin.include_role:
        name: lustre_client
        apply:
          environment:
            DEBIAN_FRONTEND: noninteractive
      vars:
        lustre_client:
          local_path: "{{ lfs_target_path }}"
          export_host: "{{ lfs_source_IP }}"
          options: "{{ lfs_options }}"
          export_path: "{{ lfs_source_path }}"
          lock: "none"
      when: add_lfs | default(false) | bool

- hosts: localhost
  gather_facts: true
  tasks:
    - name: Mount cluster bucket
      ansible.builtin.include_role:
        name: bucket-fs
      when: create_bucket | bool

- hosts: localhost
  become: true
  gather_facts: true
  tasks:
    - ansible.builtin.include_role:
        name: custom

- hosts: localhost
  vars:
    slurm_mode: "login"
    enroot_top_path: "{{ nvme_path }}/enroot/"
    compute_node: false
  pre_tasks:
    - name: Collect cluster archiecture context
      ansible.builtin.import_tasks: tasks/collect_cluster_context.yml
    - name: Prepare shared 3rdparty paths
      ansible.builtin.import_tasks: tasks/prepare_thirdparty_paths.yml
  tasks:
    - ansible.builtin.include_role:
        name: rack-aware
    - ansible.builtin.include_role:
        name: spack
      when: spack | default(false) | bool
    - ansible.builtin.include_role:
        name: metrics-exporter
      when: cluster_monitoring | default(false) | bool
    - ansible.builtin.include_role:
        name: slurm
      when: slurm | default(false) | bool

- hosts: localhost
  become: true
  vars:
    http_server_status: "configured"
    http_server_role: "login"
  gather_facts: true
  roles:
    - http_server
