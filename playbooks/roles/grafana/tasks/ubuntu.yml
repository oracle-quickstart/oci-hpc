---
- name: Add Grafana repository
  become: true
  ansible.builtin.deb822_repository:
    name: grafana
    types:
      - deb
    uris:
      - "{{ ansible_facts['oci_versions'].grafana.grafana.repo }}"
    suites:
      - stable
    components:
      - main
    signed_by: "{{ ansible_facts['oci_versions'].grafana.grafana.key_url }}"
    state: present
  register: mirror_results
  until: mirror_results is not failed
  retries: 10
  delay: 20

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true

# Install packages directly with apt on Ubuntu/Debian
- name: Install Grafana
  become: true
  ansible.builtin.apt:
    name: "{{ ansible_facts['oci_versions'].grafana.grafana.packages }}"
    state: present

- name: Start and enable Grafana service
  become: true
  ansible.builtin.service:
    name: grafana-server
    state: restarted
    enabled: true

- name: Setup Grafana
  ansible.builtin.include_tasks: setup_grafana.yml
