---
- name: Cache the pinned Caddy release in shared storage
  ansible.builtin.include_role:
    name: safe_cache
  vars:
    safe_cache_url: "{{ ansible_facts['oci_versions'].grafana.caddy.url }}"
    safe_cache_dest: "{{ ansible_facts['oci_versions'].grafana.caddy.cache }}"

- name: Install Caddy from shared storage
  vars:
    package_name: "{{ ansible_facts['oci_versions'].grafana.caddy.cache }}"
    package_state: present
    package_cache: false
  ansible.builtin.include_role:
    name: safe_yum

- name: Render the Caddyfile
  become: true
  ansible.builtin.template:
    src: "Caddyfile.j2"
    dest: /etc/caddy/Caddyfile
    force: true
    mode: "0644"

- name: Create the log directory for caddy
  become: true
  ansible.builtin.file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: "0755"

- name: Start Caddy
  become: true
  ansible.builtin.service:
    name: caddy
    enabled: true
    state: restarted
