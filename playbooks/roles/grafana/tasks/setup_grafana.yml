---
- name: Check if the Grafana token file exists
  ansible.builtin.stat:
    path: "{{ grafana_service_account.token_file }}"
  register: grafana_token_file_stat_result

- name: Wait for Grafana to be ready
  ansible.builtin.uri:
    url: "http://localhost:3000/api/health"
    status_code: 200
  register: result
  until: result.status == 200
  retries: 30
  delay: 5

- name: Change admin default password
  ansible.builtin.uri:
    url: "http://localhost:3000/api/user/password"
    method: PUT
    user: "{{ grafana_security.admin_user }}"
    password: "{{ grafana_security.default_admin_password }}"
    force_basic_auth: true
    body_format: json
    status_code: [200]
    body:
      oldPassword: "{{ grafana_security.default_admin_password }}"
      newPassword: "{{ grafana_initial_creds | b64decode }}"
      confirmNew: "{{ grafana_initial_creds | b64decode }}"
  register: service_account_result
  retries: 5
  delay: 10
  when: not grafana_token_file_stat_result.stat.exists

- name: Create service account for API access
  ansible.builtin.uri:
    url: "http://localhost:3000/api/serviceaccounts"
    method: POST
    user: "{{ grafana_security.admin_user }}"
    password: "{{ grafana_initial_creds | b64decode }}"
    force_basic_auth: true
    body_format: json
    status_code: [200, 201]
    body:
      name: "{{ grafana_service_account.name }}"
      role: "{{ grafana_service_account.role }}"
  register: service_account_result
  retries: 5
  delay: 10
  when: not grafana_token_file_stat_result.stat.exists

- name: Set service account ID
  ansible.builtin.set_fact:
    service_account_id: "{{ service_account_result.json.id if service_account_result.json is defined else (existing_service_accounts.json | selectattr('name', 'equalto',
      'oci-hpc-monitoring') | first).id }}"
  when: not grafana_token_file_stat_result.stat.exists

- name: Create service account token
  ansible.builtin.uri:
    url: "http://localhost:3000/api/serviceaccounts/{{ service_account_id }}/tokens"
    method: POST
    user: "{{ grafana_security.admin_user }}"
    password: "{{ grafana_initial_creds | b64decode }}"
    force_basic_auth: true
    body_format: json
    status_code: [200, 201]
    body:
      name: "{{ grafana_service_account.token_name }}"
  register: service_account_token
  retries: 3
  delay: 3
  when: not grafana_token_file_stat_result.stat.exists

- name: Store service account token
  become: true
  ansible.builtin.copy:
    owner: "{{ user }}"
    group: "{{ user }}"
    content: "{{ service_account_token.json.key | b64encode }}"
    dest: "{{ grafana_service_account.token_file }}"
    mode: "0400"
  when: (service_account_token.json.key is defined) and (not grafana_token_file_stat_result.stat.exists)

- name: Read Grafana token from file
  ansible.builtin.slurp:
    src: "{{ grafana_service_account.token_file }}"
  register: grafana_token

- name: Set Grafana token
  ansible.builtin.set_fact:
    grafana_api_token: "{{ grafana_token.content | b64decode | b64decode }}"

- name: Setup Grafana Alert Webhook
  ansible.builtin.include_tasks: setup_alert_webhook.yml
  when: ons_topic_ocid != ""

- name: Create Prometheus datasource in Grafana
  grafana_datasource:
    name: "Prometheus"
    grafana_url: "{{ grafana_api_url }}"
    grafana_api_key: "{{ grafana_api_token }}"
    ds_type: "prometheus"
    ds_url: "http://localhost:9090"
    is_default: true
  ignore_errors: true
  register: output

- name: Create Slurm MySQL datasource in Grafana
  grafana_datasource:
    name: "Slurm MySQL"
    uid: "slurm-mysql"
    grafana_url: "{{ grafana_api_url }}"
    grafana_api_key: "{{ grafana_api_token }}"
    ds_type: "mysql"
    ds_url: "{{ slurm_monitoring_db_host }}:{{ slurm_monitoring_db_port | default(3306) }}"
    database: "{{ slurm_monitoring_db_name | default('slurm_jobs') }}"
    user: "{{ slurm_monitoring_grafana_db_user | default('slurm_grafana') }}"
    additional_json_data:
      maxOpenConns: 10
      maxIdleConns: 10
      connMaxLifetime: 14400
    additional_secure_json_data:
      password: "{{ slurm_monitoring_grafana_db_password }}"
  register: slurm_mysql_datasource_result
  failed_when: false
  no_log: true
  when:
    - cluster_monitoring | default(false) | bool
    - slurm | default(false) | bool
    - slurm_job_monitoring | default(false) | bool
    - slurm_monitoring_db_host | default('') | string | length > 0
    - slurm_monitoring_grafana_db_password | default('') | string | length > 0

- name: Copy alert rules to grafana provisioning
  become: true
  ansible.builtin.copy:
    src: files/alert-rules.yaml
    dest: /etc/grafana/provisioning/alerting/alert-rules.yaml
    mode: "0777"
  register: alert_rules
  until: alert_rules is not failed
  retries: 3
  delay: 5

- name: Copy delete rules to grafana provisioning
  become: true
  ansible.builtin.copy:
    src: files/delete-rules.yaml
    dest: /etc/grafana/provisioning/alerting/delete-rules.yaml
    mode: "0777"
  register: delete_rules
  until: delete_rules is not failed
  retries: 3
  delay: 5

- name: Replace all occurrences of a specific string in files
  become: true
  ansible.builtin.replace:
    path: /etc/grafana/provisioning/alerting/alert-rules.yaml
    regexp: "DATASOURCE_UID"
    replace: "{{ output.datasource.uid }}"

- name: Get instance VNICs
  ansible.builtin.uri:
    url: "http://169.254.169.254/opc/v2/vnics/"
    status_code: [200]
    body_format: "json"
    headers:
      Authorization: "Bearer Oracle"
  register: instance_vnics
  until: instance_vnics is not failed
  retries: 3
  delay: 3

- name: Get VNIC details from OCI API
  become: true
  oracle.oci.oci_network_vnic_facts:
    auth_type: "instance_principal"
    vnic_id: "{{ instance_vnics.json[0].vnicId }}"
  register: vnic_details
  delegate_to: localhost

- name: Set grafana domain if public IP exists and is not empty
  ansible.builtin.set_fact:
    grafana_domain: "grafana.{{ vnic_details.vnic.public_ip }}.{{ wildcard_dns_domain }}"
  when: (vnic_details.vnic.public_ip | default('', true) | length) > 0

- name: Set grafana domain if no public IP exists
  ansible.builtin.set_fact:
    grafana_domain: "{{ vnic_details.vnic.private_ip }}"
  when: (vnic_details.vnic.public_ip | default('', true) | length) == 0

- name: Ensure controller.cluster resolves on the Grafana host
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '(^|\s)controller\.cluster(\s|$)'
    line: "{{ hostvars[groups['controller'][0]]['ansible_host'] }} {{ hostvars[groups['controller'][0]]['ansible_facts']['fqdn'] }} {{ hostvars[groups['controller'][0]]['ansible_facts']['hostname'] }} controller controller.cluster"
    state: present
  when: grafana_ldap_auth_enabled | bool

- name: Read LDAP CA certificate from controller
  become: true
  slurp:
    src: "{{ grafana_ldap.root_ca_cert }}"
  delegate_to: "{{ groups['controller'][0] }}"
  register: grafana_ldap_ca_certificate
  when: grafana_ldap_auth_enabled | bool

- name: Ensure LDAP CA certificate directory exists
  become: true
  ansible.builtin.file:
    path: "{{ grafana_ldap.root_ca_cert | dirname }}"
    state: directory
    mode: "0755"
  when: grafana_ldap_auth_enabled | bool

- name: Install LDAP CA certificate for Grafana
  become: true
  copy:
    content: "{{ grafana_ldap_ca_certificate.content | b64decode }}"
    dest: "{{ grafana_ldap.root_ca_cert }}"
    mode: "0644"
  when: grafana_ldap_auth_enabled | bool

- name: Render Grafana LDAP configuration
  become: true
  template:
    src: ldap.toml.j2
    dest: "{{ grafana_ldap_config_file }}"
    owner: root
    group: grafana
    mode: "0640"
  when: grafana_ldap_auth_enabled | bool

- name: Set Grafana LDAP auth enabled state
  become: true
  community.general.ini_file:
    path: /etc/grafana/grafana.ini
    section: auth.ldap
    option: enabled
    value: "true"
    state: present
  when: grafana_ldap_auth_enabled | bool

- name: Set Grafana LDAP config file location
  become: true
  community.general.ini_file:
    path: /etc/grafana/grafana.ini
    section: auth.ldap
    option: config_file
    value: "{{ grafana_ldap_config_file }}"
    state: present
  when: grafana_ldap_auth_enabled | bool

- name: Allow Grafana users to sign up from LDAP on first login
  become: true
  community.general.ini_file:
    path: /etc/grafana/grafana.ini
    section: auth.ldap
    option: allow_sign_up
    value: "true"
    state: present
  when: grafana_ldap_auth_enabled | bool

- name: Keep Grafana LDAP org role sync enabled
  become: true
  community.general.ini_file:
    path: /etc/grafana/grafana.ini
    section: auth.ldap
    option: skip_org_role_sync
    value: "false"
    state: present
  when: grafana_ldap_auth_enabled | bool

- name: Verify the LDAP host resolves on the Grafana host
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - "{{ grafana_ldap.host }}"
  register: grafana_ldap_host_resolution
  changed_when: false
  when: grafana_ldap_auth_enabled | bool

- name: Get ldap.toml file metadata
  become: true
  ansible.builtin.stat:
    path: "{{ grafana_ldap_config_file }}"
  register: grafana_ldap_config_file_stat
  when: grafana_ldap_auth_enabled | bool

- name: Validate ldap.toml ownership and mode
  ansible.builtin.assert:
    that:
      - grafana_ldap_config_file_stat.stat.exists
      - grafana_ldap_config_file_stat.stat.pw_name == 'root'
      - grafana_ldap_config_file_stat.stat.gr_name == 'grafana'
      - grafana_ldap_config_file_stat.stat.mode == '0640'
    fail_msg: >-
      {{ grafana_ldap_config_file }} must exist and be owned by root:grafana
      with mode 0640.
  when: grafana_ldap_auth_enabled | bool

- name: Set Grafana domain
  become: true
  community.general.ini_file:
    path: /etc/grafana/grafana.ini
    section: server
    option: domain
    value: "{{ grafana_domain }}"
    state: present

- name: Setup Caddy For OL
  ansible.builtin.include_tasks: setup_caddy_ol.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: Setup Caddy For Ubuntu
  ansible.builtin.include_tasks: setup_caddy_ubuntu.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: Restart grafana
  become: true
  ansible.builtin.service:
    name: grafana-server
    state: restarted
