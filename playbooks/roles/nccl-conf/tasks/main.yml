---
# tasks file for nccl-conf
- name: Get the shape
  ansible.builtin.uri:
    url: http://169.254.169.254/opc/v2/instance/shape
    headers:
      Authorization: "Bearer Oracle"
    return_content: true
  register: shape_nccl
  changed_when: false

- name: Get RDMA plane count for B300 and GB300
  ansible.builtin.uri:
    url: http://169.254.169.254/opc/v2/host/rdmaFabricData/planes
    headers:
      Authorization: "Bearer Oracle"
    return_content: true
  register: nccl_rdma_planes
  changed_when: false
  when: shape_nccl.content in ['BM.GPU.B300.8', 'BM.GPU.B300.HS.8', 'BM.GPU.GB300.4']

- name: Select single-plane or multi-plane NCCL configuration
  ansible.builtin.set_fact:
    nccl_multiplanar: "{{ (nccl_rdma_planes.content | default('1') | int) > 1 }}"

- name: Resolve the image-provided NCCL network plugin
  vars:
    nccl_plugin_relative_path: "{{ 'nccl_spectrum-x_plugin/lib/libnccl-net-spcx.so' if nccl_multiplanar else 'nccl_rdma_sharp_plugin/lib/libnccl-net.so' }}"
  ansible.builtin.shell:
    cmd: "ls /opt/hpcx-*/{{ nccl_plugin_relative_path }}"
  register: nccl_plugin_files
  changed_when: false
  failed_when: nccl_plugin_files.rc != 0 or nccl_plugin_files.stdout_lines | length != 1
  when: nccl_multiplanar or shape_nccl.content in ['BM.GPU.GB200.4', 'BM.GPU.GB200-v2.4', 'BM.GPU.GB200-v3.4', 'BM.GPU.GB300.4']

- name: Copy nccl.conf for Grace Blackwell
  become: true
  ansible.builtin.template:
    src: grace_blackwell
    dest: /etc/nccl.conf
    owner: root
    group: root
    mode: "0644"
  when: shape_nccl.content in ['BM.GPU.GB200.4', 'BM.GPU.GB200-v2.4', 'BM.GPU.GB200-v3.4', 'BM.GPU.GB300.4']

- name: Copy nccl.conf for RTXPRO
  become: true
  ansible.builtin.template:
    src: rtxpro
    dest: /etc/nccl.conf
    owner: root
    group: root
    mode: "0644"
  when: shape_nccl.content == 'BM.GPU.RTXPRO.8'

- name: Copy nccl.conf for H100
  become: true
  ansible.builtin.template:
    src: h100
    dest: /etc/nccl.conf
    owner: root
    group: root
    mode: "0644"
  when: shape_nccl.content == 'BM.GPU.H100.8'

- name: Copy nccl.conf for H200
  become: true
  ansible.builtin.template:
    src: h200
    dest: /etc/nccl.conf
    owner: root
    group: root
    mode: "0644"
  when: shape_nccl.content == 'BM.GPU.H200.8'

- name: Copy nccl.conf for B200
  become: true
  ansible.builtin.template:
    src: b200
    dest: /etc/nccl.conf
    owner: root
    group: root
    mode: "0644"
  when: shape_nccl.content == 'BM.GPU.B200.8'

- name: Copy nccl.conf for B300
  become: true
  ansible.builtin.template:
    src: b300
    dest: /etc/nccl.conf
    owner: root
    group: root
    mode: "0644"
  when: shape_nccl.content in ['BM.GPU.B300.8', 'BM.GPU.B300.HS.8']

- name: Copy nccl.conf for BM.GPU.B4.8 and A100-v2.8
  become: true
  ansible.builtin.template:
    src: a100_b4.8
    dest: /etc/nccl.conf
    owner: root
    group: root
    mode: "0644"
  when: shape_nccl.content == 'BM.GPU.B4.8' or shape_nccl.content == 'BM.GPU.A100-v2.8'

- name: Copy nccl.conf for BM.GPU4.8
  become: true
  ansible.builtin.template:
    src: bm.gpu4.8
    dest: /etc/nccl.conf
    owner: root
    group: root
    mode: "0644"
  when: shape_nccl.content == 'BM.GPU4.8'
