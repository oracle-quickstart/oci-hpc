---
- name: Install required packages
  vars:
    package_name:
      - libev
      - libev-devel
      - libevent-devel
      - hwloc
      - hwloc-devel
    package_repo: "{{ slurm_repos }}"
  ansible.builtin.include_role:
    name: safe_yum
  when: ansible_facts['os_family'] == 'RedHat'

- name: Download PMIx RPMs
  ansible.builtin.include_role:
    name: safe_cache
    apply:
      delegate_to: 127.0.0.1
      run_once: true
  vars:
    safe_cache_url: "{{ ansible_facts['oci_versions'].slurm[pmix_package].url }}"
    safe_cache_dest: "{{ ansible_facts['oci_versions'].slurm[pmix_package].cache }}"
  loop: "{{ pmix_download_packages }}"
  loop_control:
    loop_var: pmix_package
  run_once: true
  when: ansible_facts['os_family'] == 'RedHat'
- name: Install PMIx packages RedHat
  vars:
    package_name: "{{ pmix_packages }}"
    disable_gpg_check_var: true
  ansible.builtin.include_role:
    name: safe_yum
  when: ansible_facts['os_family'] == 'RedHat'
