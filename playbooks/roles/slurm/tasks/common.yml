---
- name: Create munge group
  become: true
  ansible.builtin.group:
    name: munge
    gid: "{{ munge_gid }}"
    state: present
    system: true
- name: Create munge user
  become: true
  ansible.builtin.user:
    name: munge
    comment: "munge"
    uid: "{{ munge_uid }}"
    group: "{{ munge_gid }}"
    shell: /sbin/nologin
    home: /var/lib/munge
    state: present
- name: Create slurm group
  become: true
  ansible.builtin.group:
    name: slurm
    gid: "{{ slurm_gid }}"
    state: present
    system: true
- name: Create slurm user
  become: true
  ansible.builtin.user:
    name: slurm
    comment: "Slurm user"
    uid: "{{ slurm_uid }}"
    group: "{{ slurm_gid }}"
    shell: /bin/bash
    home: /var/lib/slurm
    state: present

- name: Install munge
  vars:
    package_name: "{{ munge_packages }}"
    package_repo: "{{ slurm_repos }}"
  ansible.builtin.include_role:
    name: safe_yum

- name: Download Slurm DEB
  ansible.builtin.include_role:
    name: safe_cache
    apply:
      delegate_to: 127.0.0.1
      run_once: true
  vars:
    safe_cache_url: "{{ ansible_facts['oci_versions'].slurm.slurm.url }}"
    safe_cache_dest: "{{ ansible_facts['oci_versions'].slurm.slurm.cache }}"
  run_once: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Download Slurm RPMs
  ansible.builtin.include_role:
    name: safe_cache
    apply:
      delegate_to: 127.0.0.1
      run_once: true
  vars:
    safe_cache_url: "{{ ansible_facts['oci_versions'].slurm[slurm_package].url }}"
    safe_cache_dest: "{{ ansible_facts['oci_versions'].slurm[slurm_package].cache }}"
  loop: "{{ slurm_all_packages }}"
  loop_control:
    loop_var: slurm_package
  run_once: true
  when: ansible_facts['os_family'] == 'RedHat'
- name: Install .deb
  vars:
    deb_name:
      - "{{ ansible_facts['oci_versions'].slurm.slurm.cache }}"
    package_state: present
  ansible.builtin.include_role:
    name: safe_yum
  when: ansible_facts['os_family'] == 'Debian'

- name: Install SLURM common packages RedHat
  vars:
    package_name: "{{ slurm_common_packages }}"
    package_repo: "{{ slurm_repos }}"
    disable_gpg_check_var: true
  ansible.builtin.include_role:
    name: safe_yum
  when: ansible_facts['os_family'] == 'RedHat'

- name: Add Environment variable file for SLurm
  become: true
  ansible.builtin.template:
    src: "systemd/slurm_env.j2"
    dest: "/etc/default/slurm"
    backup: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Create {{ slurm_spool_path }}
  become: true
  ansible.builtin.file:
    name: "{{ slurm_spool_path }}"
    state: directory
    owner: "slurm"
    group: "slurm"
    mode: "0755"

- name: Create /run/slurm/
  become: true
  ansible.builtin.file:
    name: /run/slurm/
    state: directory
    owner: "slurm"
    group: "slurm"
    mode: "0755"

- name: Create munge dir
  become: true
  ansible.builtin.file:
    name: "{{ munge_conf_path }}"
    state: directory
    owner: munge
    group: munge
    mode: "0700"

- name: Ensure {{ slurm_log_path }} exists
  become: true
  ansible.builtin.file:
    path: "{{ slurm_log_path }}"
    owner: slurm
    group: slurm
    mode: "0750"
    state: directory

- name: Ensure {{ slurm_conf_path }} exists
  become: true
  ansible.builtin.file:
    path: "{{ slurm_conf_path }}"
    state: directory

- name: Ensure {{ munge_run_path }} has the correct permissions
  become: true
  ansible.builtin.file:
    path: "{{ munge_run_path }}"
    owner: munge
    group: munge
    mode: "0755"
    state: directory

- name: Ensure {{ munge_log_path }} has the correct permissions
  become: true
  ansible.builtin.file:
    path: "{{ munge_log_path }}"
    owner: munge
    group: munge
    mode: "0755"
    state: directory

- name: Ensure {{ slurm_conf_path }} has the correct permissions
  become: true
  ansible.builtin.file:
    path: "{{ slurm_conf_path }}"
    owner: slurm
    group: slurm
    mode: "0755"
    state: directory

- name: Include pmix prolog files
  ansible.builtin.include_tasks: common_pmix.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: Ensure prolog directory exists
  become: true
  ansible.builtin.file:
    path: "{{ slurm_conf_path }}/prolog.d"
    state: directory
    owner: root
    group: root

- name: Ensure epilog directory exists
  become: true
  ansible.builtin.file:
    path: "{{ slurm_conf_path }}/epilog.d"
    state: directory
    owner: root
    group: root

- name: Ensure plugstack include directory exists
  become: true
  ansible.builtin.file:
    path: "{{ slurm_conf_path }}/plugstack.conf.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure plugstack.conf includes drop-in configs
  become: true
  ansible.builtin.lineinfile:
    path: "{{ slurm_conf_path }}/plugstack.conf"
    line: "include {{ slurm_conf_path }}/plugstack.conf.d/*.conf"
    state: present
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Configure healthchecks
  become: true
  ansible.builtin.template:
    src: healthchecks.sh.j2
    dest: "{{ slurm_conf_path }}/prolog.d/healthchecks.sh"
    owner: root
    group: root
    mode: "0755"
  when: healthchecks|bool

- name: Copy AMD Slurm metrics prolog
  become: true
  ansible.builtin.copy:
    src: amd_prolog.sh
    dest: "{{ slurm_conf_path }}/prolog.d/amd_prolog.sh"
    owner: root
    group: root
    mode: "0755"
  when: "'BM.GPU.MI' in shape"

- name: Copy AMD Slurm metrics epilog
  become: true
  ansible.builtin.copy:
    src: amd_epilog.sh
    dest: "{{ slurm_conf_path }}/epilog.d/amd_epilog.sh"
    owner: root
    group: root
    mode: "0755"
  when: "'BM.GPU.MI' in shape"
