---
- name: Apply pending Slurm configuration before REST setup
  ansible.builtin.meta: flush_handlers

- name: Generate and save JWT token on the primary controller
  when: inventory_hostname == groups['controller'][0]
  block:
    - name: Generate JWT token
      become: true
      ansible.builtin.command: scontrol token username=slurm lifespan=infinite
      register: slurm_jwt_token_result
      changed_when: true
      no_log: true

    - name: Save JWT token to file
      become: true
      ansible.builtin.copy:
        content: "{{ slurm_jwt_token_result.stdout }}"
        dest: "{{ slurm_jwt_token_path }}"
        owner: slurm
        group: slurm
        mode: "0600"
      no_log: true

- name: Create the slurmrestd group
  become: true
  ansible.builtin.group:
    name: slurmrestd
    system: true
    state: present

- name: Create slurmrestd user
  become: true
  ansible.builtin.user:
    comment: "Slurmrestd user"
    name: slurmrestd
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    group: slurmrestd
    state: present

- name: Render slurmrestd systemd service file
  become: true
  ansible.builtin.template:
    src: systemd/slurmrestd.service.j2
    dest: /etc/systemd/system/slurmrestd.service
    owner: root
    group: root
    mode: "0644"

- name: Start slurmrestd service
  become: true
  ansible.builtin.service:
    name: slurmrestd
    daemon_reload: true
    state: restarted
    enabled: true
