---
- name: Ensure AutoDetect=full is present after "#GRES.conf" in gres.conf
  become: true
  ansible.builtin.lineinfile:
    path: "{{ slurm_conf_path }}/gres.conf"
    regexp: '^AutoDetect='
    line: "AutoDetect=full"
    insertafter: '^#GRES\.conf'

- name: Regenerate topology.yaml after adding compute nodes
  vars:
    reconfigure_slurm_state: true
  ansible.builtin.include_tasks: generate-topology.yml

- name: Run handlers
  ansible.builtin.meta: flush_handlers
