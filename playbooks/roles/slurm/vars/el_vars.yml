---
slurm_conf_path: "/etc/slurm"
slurm_log_path: "/var/log/slurm"
slurm_exec: "/usr"
slurm_conf_file: slurm.conf.j2
slurmdbd_conf_file: slurmdbd.conf.j2

cgroup_conf_file: cgroup.conf

munge_packages:
  - munge
  - munge-libs
  - munge-devel

slurm_common_package_names:
  - slurm
  - slurm_devel
  - slurm_contribs
  - slurm_perlapi
  - slurm_torque
  - slurm_openlava

slurm_server_package_names:
  - slurm_slurmctld
  - slurm_slurmdbd
  - slurm_slurmrestd

slurm_compute_package_names:
  - slurm_pam_slurm
  - slurm_libpmi
  - slurm_slurmd

slurm_backup_server_package_names:
  - slurm_slurmctld
  - slurm_pam_slurm
  - slurm_libpmi
  - slurm_slurmd

slurm_login_package_names:
  - slurm_pam_slurm
  - slurm_libpmi
  - slurm_sackd

pmix_download_packages:
  - pmix
  - pmix_devel

slurm_all_packages: >-
  {{
    (
      slurm_common_package_names
      + slurm_server_package_names
      + slurm_compute_package_names
      + slurm_backup_server_package_names
      + slurm_login_package_names
    )
    | unique
    | list
  }}

slurm_common_packages: >-
  {{
    slurm_common_package_names
    | map('extract', ansible_facts['oci_versions'].slurm, 'cache')
    | list
  }}

slurm_server_packages: >-
  {{
    slurm_server_package_names
    | map('extract', ansible_facts['oci_versions'].slurm, 'cache')
    | list
  }}

slurm_compute_packages: >-
  {{
    slurm_compute_package_names
    | map('extract', ansible_facts['oci_versions'].slurm, 'cache')
    | list
  }}

slurm_backup_server_packages: >-
  {{
    slurm_backup_server_package_names
    | map('extract', ansible_facts['oci_versions'].slurm, 'cache')
    | list
  }}

slurm_login_packages: >-
  {{
    slurm_login_package_names
    | map('extract', ansible_facts['oci_versions'].slurm, 'cache')
    | list
  }}

pmix_packages: >-
  {{
    pmix_download_packages
    | map('extract', ansible_facts['oci_versions'].slurm, 'cache')
    | list
  }}

slurm_repos: "{% if ansible_facts['distribution_major_version'] == '8' %}ol8_developer_EPEL,ol8_codeready_builder{% elif ansible_facts['distribution_major_version'] == '9' %}ol9_developer_EPEL,ol9_codeready_builder{% endif %}"
