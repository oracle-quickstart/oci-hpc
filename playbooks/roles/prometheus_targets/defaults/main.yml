---
# vars file for prometheus
prometheus_user: prometheus
prometheus_dest_dir: /etc/prometheus
prometheus_targets_dir: /etc/prometheus/targets

# Port notes from current monitoring service/exporter usage.
# 9090 - Prometheus web UI and self-scrape endpoint.
# 9100 - Node exporter system metrics for all scraped nodes.
# 9200 - Deprecated OCI FSS metrics exporter.
# 9250 - Deprecated OCI Lustre metrics exporter.
# 9273 - Telegraf OCI metrics Prometheus output when OCI metric ingestion is enabled.
# 9300 - OCI RDMA faults exporter.
# 9400 - GPU device metrics exporter for NVIDIA DCGM or AMD device metrics.
# 9500 - RDMA counters exporter.
# 9600 - NVLink counters exporter.
# 9700 - PCIe faults or critical process monitor exporter.
# 9718 - Lustre MDT, OST, and filesystem utilization exporter.
# 9800 - NVML node/GPU exporter; writes Slurm job utilization when Slurm job monitoring is enabled.
# 9900 - Slurm metrics from slurmrestd.
# 9901 - Optional Slurm REST API Prometheus exporter when Slurm job monitoring is enabled.
# 9902 - Optional Slurm job accounting exporter when Slurm job monitoring is enabled.

# mapping between the cluster exported label and prometheus label
prometheus_labels:
  availability_domain: "availability_domain"
  cluster_name: "cluster_name"
  compartment_id: "compartment_id"
  fss_mount: "fss_mount"
  gpu_memory_fabric: "gpu_memory_fabric"
  hostname: "hostname"
  hpc_island: "hpc_island"
  ip_address: "ip"
  memory_cluster_id: "memory_cluster_id"
  network_block_id: "network_block_id"
  oci_name: "oci_name"
  ocid: "ocid"
  rack_id: "rack_id"
  rail_id: "rail_id"
  role: "role"
  serial: "serial"
  shape: "shape"

compute_ports:
  - "9100"
  - "9400"
  - "9500"
  - "9600"
  - "9700"
  - "9800"

controller_ports:
  - "9100"
  - "9300"
  - "9718"
  - "9901"
  - "9902"
  - "9900"

login_ports:
  - "9100"
