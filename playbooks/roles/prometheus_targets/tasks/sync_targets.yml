---
# Ensure prometheus targets prerequisites
- name: Create group for prometheus
  become: true
  ansible.builtin.group:
    name: "{{ prometheus_user }}"
    state: present
    system: true
  run_once: true
  delegate_to: "{% if groups['monitoring'] | length > 0 %}{{ groups['monitoring'][0] }}{% else %}127.0.0.1{% endif %}"

- name: Create user for prometheus
  become: true
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    state: present
    group: "{{ prometheus_user }}"
    createhome: false
    shell: /usr/sbin/nologin
    system: true
  run_once: true
  delegate_to: "{% if groups['monitoring'] | length > 0 %}{{ groups['monitoring'][0] }}{% else %}127.0.0.1{% endif %}"

- name: Create installation folder in etc
  become: true
  ansible.builtin.file:
    path: "{{ prometheus_dest_dir }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0775"
  run_once: true
  delegate_to: "{% if groups['monitoring'] | length > 0 %}{{ groups['monitoring'][0] }}{% else %}127.0.0.1{% endif %}"

- name: Create targets folder
  become: true
  ansible.builtin.file:
    path: "{{ prometheus_targets_dir }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0775"
  run_once: true
  delegate_to: "{% if groups['monitoring'] | length > 0 %}{{ groups['monitoring'][0] }}{% else %}127.0.0.1{% endif %}"

- name: Install prometheus targets writer
  become: true
  ansible.builtin.copy:
    src: write_prometheus_targets.py
    dest: /tmp/write_prometheus_targets.py
    owner: root
    group: root
    mode: "0755"
  run_once: true
  delegate_to: "{% if groups['monitoring'] | length > 0 %}{{ groups['monitoring'][0] }}{% else %}127.0.0.1{% endif %}"

- name: Write prometheus targets input
  become: true
  ansible.builtin.copy:
    dest: /tmp/prometheus_targets_input.json
    owner: root
    group: root
    mode: "0600"
    content: "{{ prometheus_targets_input | to_json }}"
  vars:
    prometheus_targets_input:
      all_hosts_info: "{{ all_hosts_info }}"
      prometheus_labels: "{{ prometheus_labels }}"
      controller_ports: "{{ prometheus_targets_controller_ports }}"
      login_ports: "{{ login_ports }}"
      compute_ports: "{{ compute_ports }}"
    prometheus_targets_controller_ports: >-
      {{
        controller_ports
        | reject(
          'in',
          ([] if slurm_job_monitoring | default(false) | bool else ['9901', '9902'])
          + ([] if add_lfs | default(false) | bool else ['9718'])
        )
        | list
      }}
  no_log: true
  run_once: true
  delegate_to: "{% if groups['monitoring'] | length > 0 %}{{ groups['monitoring'][0] }}{% else %}127.0.0.1{% endif %}"

- name: Sync prometheus targets
  become: true
  ansible.builtin.command:
    argv:
      - /tmp/write_prometheus_targets.py
      - --input
      - /tmp/prometheus_targets_input.json
      - --targets-dir
      - "{{ prometheus_targets_dir }}"
      - --user
      - "{{ prometheus_user }}"
      - --group
      - "{{ prometheus_user }}"
      - --mode
      - "0775"
  changed_when: "'changed=0 removed=0' not in prometheus_targets_writer.stdout"
  register: prometheus_targets_writer
  run_once: true
  delegate_to: "{% if groups['monitoring'] | length > 0 %}{{ groups['monitoring'][0] }}{% else %}127.0.0.1{% endif %}"
