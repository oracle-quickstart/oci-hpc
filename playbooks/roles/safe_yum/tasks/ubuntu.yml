---
- name: Ensure apt process is completed
  become: true
  ansible.builtin.shell: ps aux | grep "apt update" | grep -v grep | wc -l
  register: result
  retries: 30
  delay: 10
  until: result.stdout | int == 0

- name: "Installing/Removing package"
  become: true
  ansible.builtin.apt:
    name: "{{ package_name }}"
    state: "{{ package_state | default('latest') }}"
    purge: "{{ package_purge | default('false') }}"
    update_cache: "{{ package_cache | default('true') }}"
    lock_timeout: 120
    cache_valid_time: "{{ package_cache_valid_time | default('3600') }}"
  register: result
  until: result is not failed
  retries: 5
  delay: 5
  when: package_name | length > 0

- name: "Installing/Removing deb package"
  become: true
  ansible.builtin.apt:
    deb: "{{ item }}"
    state: "{{ package_state | default('latest') }}"
    purge: "{{ package_purge | default('false') }}"
    update_cache: "{{ package_cache | default('true') }}"
    lock_timeout: 120
    cache_valid_time: "{{ package_cache_valid_time | default('3600') }}"
  register: result
  until: result is not failed
  retries: 5
  delay: 5
  with_items: "{{ deb_name }}"

- name: Ensure apt process is completed
  become: true
  ansible.builtin.shell: ps aux | grep "apt update" | grep -v grep | wc -l
  register: result
  retries: 30
  delay: 10
  until: result.stdout | int == 0
