---
- name: Choose Java package on OL/RHEL
  ansible.builtin.set_fact:
    java_pkg: >-
      {{ 'java-17-openjdk' if (ansible_facts['distribution'] == 'OracleLinux'
         and (ansible_facts['distribution_major_version'] | int) >= 9) else 'java-11-openjdk' }}
  when: ansible_facts['os_family'] == "RedHat"

- name: Install Java for SDK generation (Ubuntu)
  become: true
  ansible.builtin.apt:
    name:
      - default-jre
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: Install Java for SDK generation (OL/RHEL)
  become: true
  ansible.builtin.dnf:
    name:
      - "{{ java_pkg }}"
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Set Python/UV facts from venv
  set_fact:
    python_executable: "{{ venv_path }}/bin/python3"
    uv_cmd: "{{ (venv_path | regex_replace('/oci$', '')) ~ '/uv' }}"

- name: Verify venv Python exists
  stat:
    path: "{{ python_executable }}"
  register: venv_python_stat
  failed_when: not venv_python_stat.stat.exists

- name: Get Python version from venv
  command: "{{ python_executable }} --version"
  register: python_version_output
  changed_when: false

# Extract version number for backward compatibility with templates
- name: Extract Python version number
  set_fact:
    python_version: "{{ python_version_output.stdout | regex_replace('^Python ([0-9]+\\.[0-9]+).*', '\\1') }}"

- name: Display detected Python
  debug:
    msg: "Using Python: {{ python_executable }} (version {{ python_version }})"

- name: Download openapi-generator jar
  ansible.builtin.include_role:
    name: safe_cache
  vars:
    safe_cache_url: "{{ ansible_facts['oci_versions'].slurm_rest_api.openapi_generator.url }}"
    safe_cache_dest: "{{ openapi_download_path }}/openapi-generator.jar"

# ----------------- Read JWT + OpenAPI Spec -----------------
- name: Read JWT token from file
  slurp:
    src: "{{ slurm_jwt_token_path }}"
  register: jwt_token_file
  become: true
  delegate_to: 127.0.0.1
  run_once: true

- name: Set JWT token fact
  set_fact:
    slurm_jwt_token: "{{ (jwt_token_file.content | b64decode).split('=')[1] }}"
  delegate_to: 127.0.0.1
  run_once: true

- name: Fetch Slurm API versions
  ansible.builtin.uri:
    url: "{{ slurm_rest_api_spec_url }}"
    return_content: true
    headers:
      X-SLURM-USER-NAME: "{{ slurm_user }}"
      X-SLURM-USER-TOKEN: "{{ slurm_jwt_token }}"
  register: api_response
  delegate_to: 127.0.0.1
  run_once: true

- name: Extract all version strings
  ansible.builtin.set_fact:
    version_strings: >-
      {{ api_response.content | regex_findall('slurm_v([0-9]+)_get_jobs') }}
  delegate_to: 127.0.0.1
  run_once: true

- name: Set highest version string
  ansible.builtin.set_fact:
    slurm_api_version: >-
      {{ version_strings | max | string }}
  delegate_to: 127.0.0.1
  run_once: true

- name: Download Slurm OpenAPI spec
  uri:
    url: "{{ slurm_rest_api_spec_url }}"
    dest: "{{ openapi_download_path }}/{{ slurm_rest_api_spec_filename }}"
    headers:
      X-SLURM-USER-NAME: "{{ slurm_user }}"
      X-SLURM-USER-TOKEN: "{{ slurm_jwt_token }}"
  become: true
  delegate_to: 127.0.0.1
  run_once: true
# ----------------- Generate SDK -----------------
- name: Ensure SDK output directory
  file:
    path: "{{ sdk_output_dir }}"
    state: directory
  become: true
  delegate_to: 127.0.0.1
  run_once: true

- name: Generate Slurm python SDK from OpenAPI
  command:
    cmd: >
      java -jar {{ openapi_download_path }}/openapi-generator.jar generate
      -g python
      -i {{ openapi_download_path }}/{{ slurm_rest_api_spec_filename }}
      -o {{ sdk_output_dir }}/
    chdir: "{{ openapi_download_path }}"
  become: true
  delegate_to: 127.0.0.1
  run_once: true

- name: Build and install slurm sdk wheel into venv with uv
  ansible.builtin.shell: |
    {{ uv_cmd }} pip install \
      -p {{ python_executable }} \
      --force-reinstall --upgrade {{ sdk_output_dir }}
  args:
    chdir: "{{ sdk_output_dir }}"
  environment:
    UV_PYTHON: "{{ python_executable }}"
  become: true
  delegate_to: 127.0.0.1
  run_once: true

- name: Verify SDK installation
  command: "{{ python_executable }} -c \"import importlib; importlib.import_module('openapi_client')\""
  register: sdk_verify
  changed_when: false
  failed_when: sdk_verify.rc != 0
  become: true
  delegate_to: 127.0.0.1
  run_once: true

- name: Display SDK installation info
  debug:
    msg: "{{ sdk_verify.stdout_lines }}"
  delegate_to: 127.0.0.1
  run_once: true
