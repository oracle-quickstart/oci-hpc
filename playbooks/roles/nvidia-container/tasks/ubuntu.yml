---
- name: Add key
  become: true
  ansible.builtin.apt_key:
    url: "{{ ansible_facts['oci_versions'].nvidia_container.key_url }}"
    state: present

- name: Add repo
  become: true
  ansible.builtin.get_url:
    url: "{{ ansible_facts['oci_versions'].nvidia_container.repo }}"
    dest: "/etc/apt/sources.list.d/{{ ansible_facts['oci_versions'].nvidia_container.repo | basename }}"
    mode: "0644"
    owner: root
    group: root

- name: Install packages
  vars:
    package_name: "{{ ansible_facts['oci_versions'].nvidia_container.packages }}"
    package_state: present
    package_cache: true
  ansible.builtin.include_role:
    name: safe_yum

- name: Start Docker
  become: true
  ansible.builtin.service:
    name: "docker"
    state: restarted
