---
- name: Add AMD Container Toolkit repository
  become: true
  ansible.builtin.deb822_repository:
    name: amd-container-toolkit
    types: deb
    uris: "{{ ansible_facts['oci_versions'].amd_container.repo }}"
    suites: jammy
    components: main
    architectures: amd64
    signed_by: "{{ ansible_facts['oci_versions'].amd_container.key_url }}"
    state: present

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Install the AMD Container Toolkit package
  become: true
  ansible.builtin.apt:
    name: "{{ ansible_facts['oci_versions'].amd_container.packages }}"
    state: present
    update_cache: true

- name: Configure the AMD container runtime
  become: true
  ansible.builtin.command:
    cmd: amd-ctk runtime configure

- name: Restart the Docker daemon to apply changes
  become: true
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true
