---
- name: Cache Dr HPC package
  ansible.builtin.include_role:
    name: safe_cache
  vars:
    safe_cache_url: "{{ ansible_facts['oci_versions'].dr_hpc.url }}"
    safe_cache_dest: "{{ ansible_facts['oci_versions'].dr_hpc.cache }}"

- name: Install Dr HPC package # noqa: var-naming[no-role-prefix] -- safe_yum's existing interface
  ansible.builtin.include_role:
    name: safe_yum
  vars:
    package_name: "{{ ansible_facts['oci_versions'].dr_hpc.cache }}"
    package_state: present
    package_cache: false
    disable_gpg_check_var: true
