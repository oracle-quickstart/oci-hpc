---
- name: Create systemd unit dirs
  become: true
  ansible.builtin.file:
    name: "/opt/oci-hpc/healthchecks"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Create systemd unit dirs
  become: true
  ansible.builtin.file:
    name: "/var/log/healthchecks"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copy files
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/oci-hpc/healthchecks/{{ item }}"
    force: false
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  with_items:
    - check_gpu_setup.py
    - active_healthcheck.py
    - active_HC.sbatch
    - gpu_bw_test.py
    - rdma_link_flapping.py
    - xid_checker.py
    - xid_catalog_data.json
    - shared_logging.py
    - multi_node_active_HC.sbatch
    - multi_node_active_healthcheck.py
    - gpu_sdc_checker.py
    - gpu_reset.sh

- name: Change gpu_reset.sh file mode to 0755
  ansible.builtin.file:
    path: /opt/oci-hpc/healthchecks/gpu_reset.sh
    mode: '0755'

- name: Make sure healthcheck dependencies are installed.
  vars:
    package_name:
      - python3-psutil
      - python3-distro
      - nvme-cli
      - fio
    package_state: latest
  ansible.builtin.include_role:
    name: safe_yum
  ignore_errors: true
