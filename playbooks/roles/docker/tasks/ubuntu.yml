---
# added register, until, retries, delay so that if the apt lock is held by other process, it can finish and then retry to install packages.
- name: Update apt and install pre-req packages for docker
  vars:
    package_name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    package_state: latest
  ansible.builtin.include_role:
    name: safe_yum
  ignore_errors: true

- name: Download Docker APT repo GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/ubuntu/gpg"
    dest: /tmp/docker.asc.gpg
    mode: '0644'
    force: true

- name: Convert Docker APT repo key to binary keyring
  become: true
  ansible.builtin.command:
    cmd: "gpg --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker.asc.gpg"
    creates: /etc/apt/keyrings/docker.gpg

- name: Add Docker repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    signed_by: /etc/apt/keyrings/docker.gpg
    state: present

- name: Update apt cache for Docker repository
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
    lock_timeout: 120
  register: docker_apt_cache
  until: docker_apt_cache is not failed
  retries: 5
  delay: 5

- name: Update apt and install pre-req packages for docker
  vars:
    package_name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    package_state: latest
    package_cache: true
    package_cache_valid_time: 0
  ansible.builtin.include_role:
    name: safe_yum
  ignore_errors: true

- name: Force docker gid 999
  become: true
  ansible.builtin.lineinfile:
    path: /etc/group
    state: present
    regexp: "^docker:x:(.*)$"
    line: "docker:x:999:{{ cluster_admin_user }}"
    backrefs: true

- name: Restart docker
  become: true
  ansible.builtin.service:
    name: docker.socket
    state: restarted
    enabled: true

# start is not needed - it starts dokcer as part of install
- name: Enable service Docker
  become: true
  ansible.builtin.service:
    name: "docker"
    enabled: true

- name: Enable service containerd
  become: true
  ansible.builtin.service:
    name: containerd
    enabled: true
