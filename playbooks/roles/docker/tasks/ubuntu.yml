---
# added register, until, retries, delay so that if the apt lock is held by other process, it can finish and then retry to install packages.
- name: Update apt and install pre-req packages for docker
  vars:
    package_name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    package_state: latest
  ansible.builtin.include_role:
    name: safe_yum
  ignore_errors: true

- name: Add Docker repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "{{ ansible_facts['oci_versions'].docker.repo }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    signed_by: "{{ ansible_facts['oci_versions'].docker.key_url }}"
    state: present

- name: Update apt cache for Docker repository
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
    lock_timeout: 120
  register: docker_apt_cache
  until: docker_apt_cache is not failed
  retries: 5
  delay: 5

- name: Update apt and install pre-req packages for docker
  vars:
    package_name: "{{ ansible_facts['oci_versions'].docker.packages }}"
    package_state: latest
    package_cache: true
    package_cache_valid_time: 0
  ansible.builtin.include_role:
    name: safe_yum
  ignore_errors: true

- name: Force docker gid 999
  become: true
  ansible.builtin.lineinfile:
    path: /etc/group
    state: present
    regexp: "^docker:x:(.*)$"
    line: "docker:x:999:{{ cluster_admin_user }}"
    backrefs: true

- name: Restart docker
  become: true
  ansible.builtin.service:
    name: docker.socket
    state: restarted
    enabled: true

# start is not needed - it starts dokcer as part of install
- name: Enable service Docker
  become: true
  ansible.builtin.service:
    name: "docker"
    enabled: true

- name: Enable service containerd
  become: true
  ansible.builtin.service:
    name: containerd
    enabled: true
