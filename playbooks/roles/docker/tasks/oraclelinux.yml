---
- block:
    - name: Install yum utils
      vars:
        package_name:
          - yum-utils
        package_state: latest
        package_repo: "ol{{ ansible_facts['distribution_major_version'] }}_developer_EPEL" # noqa: var-naming[no-role-prefix]
      ansible.builtin.include_role:
        name: safe_yum

    - name: Add docker-ce repository
      become: true
      ansible.builtin.yum_repository:
        name: docker-ce
        description: Docker CE Stable - $basearch
        baseurl: "{{ ansible_facts['oci_versions'].docker.repo }}"
        enabled: 1
        gpgcheck: 1
        gpgkey: "{{ ansible_facts['oci_versions'].docker.key_url }}"

    - name: Install Docker
      vars:
        package_name: "{{ ansible_facts['oci_versions'].docker.packages }}"
        package_state: latest
        package_cache: true
        package_repo: "ol{{ ansible_facts['distribution_major_version'] }}_developer_EPEL" # noqa: var-naming[no-role-prefix]
      ansible.builtin.include_role:
        name: safe_yum

    - name: Start Docker
      become: true
      ansible.builtin.service:
        name: "docker"
        enabled: true
        state: started

    - name: Enable service containerd
      become: true
      ansible.builtin.service:
        name: containerd
        enabled: true

    - name: Create docker group
      become: true
      ansible.builtin.group:
        name: docker
        state: present
    - name: Add opc user to docker group
      become: true
      ansible.builtin.user:
        name: opc
        groups: docker
        append: true
