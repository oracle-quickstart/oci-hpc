---
# tasks for mariadb role

- include_vars: ubuntu_vars.yml
  when: ansible_facts['distribution_major_version'] < "22"

- include_vars: ubuntu-2204_vars.yml
  when: ansible_facts['distribution_major_version'] >= "22"

- name: Create /etc/opt/oci-hpc/passwords/mysql
  become: true
  file:
    path: /etc/opt/oci-hpc/passwords/mysql
    state: directory
    owner: "{{ cluster_admin_user }}"
    mode: "0770"
    group: "{{ cluster_admin_user }}"
    recurse: true

- name: Generate password for DB root and save it to /etc/opt/oci-hpc/passwords
  set_fact:
    tmp_pwd: "{{ lookup('password', '/etc/opt/oci-hpc/passwords/mysql/root.txt chars=ascii_letters,digits,hexdigits') }}"

- name: Get root password from /etc/opt/oci-hpc/passwords
  set_fact:
    mysql_root_pwd: "{{ lookup('password', '/etc/opt/oci-hpc/passwords/mysql/root.txt chars=ascii_letters,digits,hexdigits') }}"

- name: Add repository to install python-mysqldb
  become: true
  ansible.builtin.deb822_repository:
    name: ubuntu-bionic-main
    types:
      - deb
    uris:
      - http://archive.ubuntu.com/ubuntu
    suites:
      - bionic
    components:
      - main
    state: present
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - ansible_facts['distribution_major_version'] | int < 22

- name: Install MariaDB packages
  vars:
    package_name: "{{ deb_mariadb_packages }}"
  include_role:
    name: safe_yum

- name: Ensure {{ mysql_db_path }} exists
  become: true
  file:
    path: "{{ mysql_db_path }}"
    owner: mysql
    group: mysql
    state: directory

- name: Render /etc/my.cnf
  become: true
  template:
    src: "debian_mariadb_etc_my.cnf.j2"
    dest: "/etc/my.cnf"
    backup: true
  notify: Restart mariadb

- name: Create configuration directory
  become: true
  file:
    path: /etc/my.cnf.d/
    mode: "0755"
    owner: root
    group: root
    state: directory

- name: Copy innodb.cnf
  become: true
  copy:
    src: innodb.cnf
    dest: /etc/my.cnf.d/innodb.cnf

- name: Create MariaDB configuration directory
  become: true
  ansible.builtin.file:
    path: /etc/mysql/mariadb.conf.d/
    mode: "0755"
    owner: root
    group: root
    state: directory

- name: Configure MariaDB TCP bind for local monitoring DB
  become: true
  ansible.builtin.template:
    src: monitoring_bind.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/99-oci-hpc-monitoring.cnf
    owner: root
    group: root
    mode: "0644"
  notify: Restart mariadb
  when:
    - cluster_monitoring | default(false) | bool
    - slurm_job_monitoring | default(false) | bool
    - (slurm_monitoring_mysql_backend | default('managed')) == 'local'

- name: Remove MariaDB TCP bind override when local monitoring DB is disabled
  become: true
  ansible.builtin.file:
    path: /etc/mysql/mariadb.conf.d/99-oci-hpc-monitoring.cnf
    state: absent
  notify: Restart mariadb
  when: >-
    not (
      cluster_monitoring | default(false) | bool
      and slurm_job_monitoring | default(false) | bool
      and (slurm_monitoring_mysql_backend | default('managed')) == 'local'
    )

- name: Enable MariaDB service
  become: true
  service:
    name: mariadb
    enabled: true

- block:
    - name: Start MariaDB service
      become: true
      service:
        name: mariadb
        state: started

    - meta: flush_handlers

     # added to resolve error unable to connect to database,check login_user and login_password are correct or/root/.my.cnf has the credentials.Exception message: (1698, "Access denied for user ''root''@''localhost''")'
     #  - name: Change the authentication plugin of MySQL root user to mysql_native_password
     #  shell: mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password"

     #- name: Flush Privileges
     #shell: mysql -u root -e 'FLUSH PRIVILEGES'

    - name: Set MariaDB's root password
      become: true
      mysql_user:
        name: "root"
        password: "{{ mysql_root_pwd }}"
        host_all: true
        check_implicit_admin: true
        login_unix_socket: /run/mysqld/mysqld.sock
        state: present
      when: ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] >= "22"

    - name: Set MariaDB's root password
      become: true
      mysql_user:
        name: "root"
        password: "{{ mysql_root_pwd }}"
        host_all: true
        check_implicit_admin: true
        state: present
      when: ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] < "22"

    - name: Render /root/.my.cnf
      become: true
      template:
        src: debian_my.cnf.j2
        dest: /root/.my.cnf
        owner: root
        group: root
        mode: "0600"

    - name: Remove anonymous users
      become: true
      mysql_user:
        config_file: "/root/.my.cnf"
        name: ""
        host_all: true
        state: absent

    - name: Remove test db
      become: true
      mysql_db:
        config_file: "/root/.my.cnf"
        name: test
        state: absent
