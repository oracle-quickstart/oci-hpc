---
- name: Restart Lustre utilization exporter
  become: true
  ansible.builtin.systemd:
    name: lustre-utilization-exporter
    state: restarted
    daemon_reload: true

- name: Restart dcgm exporter
  become: true
  ansible.builtin.systemd:
    name: dcgm-exporter
    daemon_reload: true
    enabled: true
    state: restarted

- name: Restart otelcol agent
  become: true
  ansible.builtin.systemd:
    name: otelcol-agent.service
    daemon_reload: true
    state: restarted

- name: Restart NCCL inspector collector
  become: true
  ansible.builtin.systemd:
    name: nccl-inspector-collector.service
    daemon_reload: true
    state: restarted
