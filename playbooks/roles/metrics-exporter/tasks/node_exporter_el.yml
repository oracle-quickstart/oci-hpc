- name: Create prometheus group on compute
  become: true
  ansible.builtin.group:
    name: prometheus
    state: present
    system: true

- name: Create user for prometheus
  become: true
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    state: present
    createhome: false
    shell: /usr/sbin/nologin
    group: prometheus

- name: Create /var/lib/prometheus/node_exporter directory
  become: true
  ansible.builtin.file:
    path: "/var/lib/prometheus/node_exporter"
    state: directory
    owner: "prometheus"
    group: "prometheus"

- name: Cache node_exporter tarballs once per architecture
  ansible.builtin.include_role:
    name: safe_cache
    apply:
      delegate_to: 127.0.0.1
      run_once: true
  vars:
    safe_cache_url: "{{ ansible_facts['oci_versions'].metrics_exporter.node_exporter[item].url }}"
    safe_cache_dest: "{{ ansible_facts['oci_versions'].metrics_exporter.node_exporter[item].cache }}"
  loop: "{{ metrics_exporter_target_architectures }}"
  run_once: true

- name: Extract node_exporter {{ node_exporter }} into /var/lib/prometheus/node_exporter/
  become: true
  ansible.builtin.unarchive:
    src: "{{ ansible_facts['oci_versions'].metrics_exporter.node_exporter.cache }}"
    dest: /var/lib/prometheus/node_exporter/
    extra_opts: [--strip-components=1]
    remote_src: true

- name: Recursively change ownership of a /var/lib/prometheus/node_exporter/
  become: true
  ansible.builtin.file:
    path: /var/lib/prometheus/node_exporter
    state: directory
    recurse: true
    owner: prometheus
    group: prometheus

- name: Create a symbolic link node_exporter
  become: true
  ansible.builtin.file:
    src: /var/lib/prometheus/node_exporter/node_exporter
    dest: /usr/bin/node_exporter
    state: link

- name: Configure node_exporter service
  become: true
  ansible.builtin.copy:
    src: "node_exporter.service"
    dest: "/usr/lib/systemd/system/node_exporter.service"

- name: Run command deactivate selinux for node_exporter, chcon
  become: true
  ansible.builtin.command: chcon --reference=/bin/less /usr/bin/node_exporter

- name: Run command deactivate selinux for node_exporter, semanage
  become: true
  ansible.builtin.command: python3 /usr/sbin/semanage fcontext -a -t bin_t "/usr/bin/node_exporter"
  register: node_exporter
  failed_when: "node_exporter.rc != 0 and 'already defined' not in node_exporter.stderr"

- name: Start node_exporter.service
  become: true
  ansible.builtin.service:
    name: node_exporter.service
    state: restarted
    enabled: true
