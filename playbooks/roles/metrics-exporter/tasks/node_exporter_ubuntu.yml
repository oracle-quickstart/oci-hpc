- name: Create prometheus group on compute
  become: true
  ansible.builtin.group:
    name: prometheus
    state: present
    system: true

- name: Create prometheus user on compute
  become: true
  ansible.builtin.user:
    name: prometheus
    comment: "prometheus user"
    group: prometheus
    createhome: false # Optional: depending on if you want to create a home directory

- name: Create /var/lib/prometheus/node_exporter directory
  become: true
  ansible.builtin.file:
    path: "/var/lib/prometheus/node_exporter"
    state: directory
    owner: "prometheus"
    group: "prometheus"

- name: Cache node_exporter tarballs once per architecture
  ansible.builtin.include_role:
    name: safe_cache
    apply:
      delegate_to: 127.0.0.1
      run_once: true
  vars:
    safe_cache_url: "{{ ansible_facts['oci_versions'].metrics_exporter.node_exporter[item].url }}"
    safe_cache_dest: "{{ ansible_facts['oci_versions'].metrics_exporter.node_exporter[item].cache }}"
  loop: "{{ metrics_exporter_target_architectures }}"
  run_once: true

- name: Extract node_exporter {{ node_exporter }} into /var/lib/prometheus/node_exporter/
  become: true
  ansible.builtin.unarchive:
    src: "{{ ansible_facts['oci_versions'].metrics_exporter.node_exporter.cache }}"
    dest: "/var/lib/prometheus/node_exporter/"
    extra_opts: ["--strip-components=1"]
    remote_src: true

- name: Recursively change ownership of /var/lib/prometheus/node_exporter/
  become: true
  ansible.builtin.file:
    path: /var/lib/prometheus/node_exporter
    state: directory
    recurse: true
    owner: prometheus
    group: prometheus

- name: Create a symbolic link for node_exporter
  become: true
  ansible.builtin.file:
    src: /var/lib/prometheus/node_exporter/node_exporter
    dest: /usr/bin/node_exporter
    state: link

- name: Configure node_exporter service
  become: true
  ansible.builtin.copy:
    src: "node_exporter.service"
    dest: "/etc/systemd/system/node_exporter.service"

- name: Start and enable node_exporter service
  become: true
  ansible.builtin.systemd:
    name: node_exporter.service
    state: restarted
    enabled: true
