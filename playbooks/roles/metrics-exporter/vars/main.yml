---
# Variables
gpu_ports: 9400
prometheus_user: prometheus
metrics_exporter_target_architectures: "{{ hostvars['localhost'].cluster_target_architectures | default([ansible_facts['architecture']]) }}"

go_install_dir: "/usr/local"
go_path: "/usr/local/go/bin"
dcgm_service_path: "/etc/systemd/system/dcgm-exporter.service"
dcgm_release_cache_path: "{{ thirdparty_root_path }}/noarch/metrics-exporter/dcgm-exporter-releases.txt"
dcgm_tarball_path: "{{ metrics_exporter_shared_path }}/dcgm-exporter/dcgm-exporter.tar.gz"
dcgm_build_path: >-
  {{ metrics_exporter_shared_path }}/dcgm-exporter/{{
  ansible_facts['distribution'] }}_{{
  ansible_facts['distribution_version'] }}
nccl_inspector_cache_dir: "{{ thirdparty_arch_path }}/nccl-inspector"
nccl_inspector_artifact_path: >-
  {{ nccl_inspector_cache_dir }}/{{ ansible_facts['distribution'] }}_{{
  ansible_facts['distribution_version'] }}_{{ ansible_facts['architecture']
  }}/libnccl-profiler-inspector-{{ nccl_inspector_ref }}.so
dependencies: "{{ rhel_dependencies if ansible_facts['os_family'] == 'RedHat' else ubuntu_dependencies }}"
ubuntu_dependencies:
  - wget
  - make
  - build-essential
rhel_dependencies:
  - wget
  - make
  - gcc
  - gcc-c++
