  prechecks:
    type: boolean
    title: "Run function prechecks"
    description: "If checked, will invoke the function for a dry-run to confirm all policies are in place"
    default : true
    required: true

  login_to_ocir_using_default_domain:
    type: boolean
    title: "Current User Belongs to Default Identity Domain"
    description: "Uncheck if current user belongs to non default identity domain. Domain information is used to generate the login user for OCIR."
    default : true
    required: true
    visible:
      or:
        - ${is_gov_cloud}
        - not:
          - ${use_OCI_generated_container}

  custom_domain_ocid_to_authenticate_to_ocir:
    type: string
    title: "OCID of the identity domain the current user belongs to"
    default : ""
    description: "OCID of the identity domain the user deploying the stack belongs to. Domain information is used to generate the login user for OCIR."
    visible:
      and:
        - or:
          - ${is_gov_cloud}
          - not:
            - ${use_OCI_generated_container}
        - not:
          - ${login_to_ocir_using_default_domain}

  create_policies:
    title: "Create Policies"
    description: "Create IAM policies for the Slurm controller and function resource principals. This option assumes your user has the necessary permissions to create policies."
    type: boolean
    default: false

  use_existing_dynamic_group:
    title: "Use existing Dynamic Group"
    description: "Select an existing dynamic group instead of creating a new one."
    type: boolean
    default: false
    visible: ${create_policies}

  dynamic_group_id:
    title: "Dynamic Group"
    description: "Select an existing dynamic group."
    type: oci:identity:dynamicgroups:id
    required: true
    default: ""
    dependsOn:
      compartmentId: identity_domain_compartment_id
    visible:
      and:
        - ${create_policies}
        - ${use_existing_dynamic_group}

  use_default_identity_domain:
    type: boolean
    title: "Use the Default Identity Domain"
    description: "Use the default identity domain of the tenancy. Uncheck to choose a different identity domain."
    default : true
    required: true
    visible: ${create_policies}


  identity_domain_compartment_id:
    title: "Identity Domain Compartment"
    description: "Select the compartment where your identity domain is located."
    type: oci:identity:compartment:id
    required: true
    default: ${tenancy_ocid}
    visible:
      and:
        - or:
          - ${create_policies}
          - not:
            - ${use_OCI_generated_container}
          - ${is_gov_cloud}
        - not:
          - ${use_default_identity_domain}

  identity_domain_ocid:
    type: oci:identity:domains:id
    title: "Identity Domain"
    default : ""
    description: "Select an identity domain."
    required: true
    dependsOn:
      compartmentId: identity_domain_compartment_id
    visible:
      and:
        - or:
          - ${create_policies}
          - not:
            - ${use_OCI_generated_container}
          - ${is_gov_cloud}
        - not:
          - ${use_default_identity_domain}

  is_gov_cloud:
    type: boolean
    title: "Gov or Defense cloud region"
    description: "Please specify if this deployment is occuring in a government or defense cloud region"
    default : false
    required: true

  use_OCI_generated_container:
    type: boolean
    title: "Point to an existing public OCIR in the region"
    description: "Commercial regions: keep enabled to pull the published OCI-HPC image from public OCIR (no auth token needed), uncheck to rebuild and push your own image (if unsure, keep checked). Gov/air-gapped regions: Make sure this is unchecked for the stack to mirror the public image into your tenancy using a token."
    default : true
    required: true

  use_existing_auth_token:
    type: boolean
    title: "Use existing auth token"
    default : false
    description: "Use an auth token you already created (OCI limits users to two active tokens). Needed when rebuilding your own image or when mirroring into Gov/air-gapped regions; ignored when simply pulling the public image in commercial regions."
    required: false

  auth_token:
    title: "Auth token"
    type: password
    default : ""
    description: "Auth token as a string."
    required: false
    visible:
      and:
        - ${use_existing_auth_token}

  home_region:
    type: oci:identity:region:name
    title: "Home Region"
    default: ${region}
    required: true
    description: "Home region to generate IAM resources (Auth Token and/or Customer Secret Key)."
    visible:
      or:
        - ${create_bucket}
        - ${create_policies}
        - ${use_existing_auth_token}

  use_existing_registry:
    type: boolean
    title: "Use existing registry"
    default : "false"
    description: "Use existing registry to push serverless function."
    required: true
    visible:
      not:
        - ${use_OCI_generated_container}

  registry_id:
    type: string
    title: "OCID of existing registry"
    default : ""
    description: "OCID of existing registry."
    required: true
    visible:
      and:
        - ${use_existing_registry}
        - not:
          - ${use_OCI_generated_container}

  add_lfs:
    type: boolean
    title: "Add Lustre Filesystem"
    default: false
    description: "If chosing an existing Lustre filesystem, it should pre-exist and be in the same subnet as the GPU/HPC compute nodes."
    visible: true

  create_lfs:
    type: enum
    title: "Create Lustre Filesystem"
    enum:
      - "existing"
      - "new"
    default: "new"
    description: "For Lustre, leave options field as-is unless you require specific options."
    visible:
      and:
        - ${add_lfs}

  lfs_compartment:
    title: "Lustre File System Compartment"
    description: "Compartment for provisioning Lustre File System."
    type: oci:identity:compartment:id
    default: ${targetCompartment}
    required: true
    visible:
      and:
        - ${add_lfs}
        - eq:
          - ${create_lfs}
          - "new"

  lfs_ad:
    type: oci:identity:availabilitydomain:name
    dependsOn:
      compartmentId: ${lfs_compartment}
    visible:
      and:
        - ${add_lfs}
        - eq:
          - ${create_lfs}
          - "new"
    default: ${ad}
    description: "Availability Domain (should be the same as CPU/GPU compute instances for best performance)."
    title: "LFS Availability Domain"
    required: true

  lfs_capacity_in_gbs:
    type: integer
    required: true
    minimum: 31200
    title: "Size of Lustre Filesystem share in GBs (Should be in multiples of 10400)"
    default: 31200
    visible:
      and:
        - ${add_lfs}
        - eq:
          - ${create_lfs}
          - "new"

  lfs_perf_tier:
    type: enum
    required: true
    title: "Lustre Performance Tier"
    enum:
      - "MBPS_PER_TB_125"
      - "MBPS_PER_TB_250"
      - "MBPS_PER_TB_500"
      - "MBPS_PER_TB_1000"
    default: "MBPS_PER_TB_125"
    visible:
      and:
        - ${add_lfs}
        - eq:
          - ${create_lfs}
          - "new"

  lfs_freeform_tag_key:
    type: string
    title: "Lustre Freeform Tag Key"
    default: ""
    description: "Optional freeform tag key to apply when creating a new Lustre file system."
    visible:
      and:
        - ${add_lfs}
        - eq:
          - ${create_lfs}
          - "new"

  lfs_freeform_tag_value:
    type: string
    title: "Lustre Freeform Tag Value"
    default: ""
    description: "Optional freeform tag value to apply when creating a new Lustre file system."
    visible:
      and:
        - ${add_lfs}
        - eq:
          - ${create_lfs}
          - "new"

  lfs_target_path:
    type: string
    title: "LFS Path"
    description: "Local path on which Lustre filesystem will be mounted."
    required: true
    default: "/lfs"
    visible:
      and:
        - ${add_lfs}

  lfs_source_IP:
    type: string
    title: "Lustre Server IP"
    description: "IP address of the Lustre server."
    required: true
    default: "0.0.0.0"
    visible:
      and:
        - ${add_lfs}
        - eq:
          - ${create_lfs}
          - "existing"

  lfs_source_path:
    type: string
    title: "Lustre Server Path"
    default: "lustrefs"
    minLength: 1
    maxLength: 8
    description: "Lustre filesystem share path on the Lustre server."
    visible:
      and:
        - ${add_lfs}
    required: true

  lfs_options:
    type: string
    title: "Options"
    default: "defaults,_netdev"
    description: "Recommended mount options for LFS. Do not modify unless you require custom options."
    visible:
      and:
        - ${add_lfs}
